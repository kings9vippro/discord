services:
  - type: web
    name: discord-phan-anh-khoi
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DISCORD_BOT_TOKENS
        sync: false
      - key: DISCORD_GUILD_IDS
        sync: false
